<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powick Ramblers | Add a Walk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
        (function() {
            const accessKey = localStorage.getItem('ramblers_access');
            const now = new Date().getTime();
            if (!accessKey || now > parseInt(accessKey)) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        :root {
            --bg-body: #f4f7f1;
            --header-bg: #0f1f0d;
            --primary-green: #2d5a27;
            --white: #ffffff;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; overflow-x: hidden; }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #0a1409 0%, #152b12 100%);
            color: var(--white);
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 20px;
        }

        h1 { font-family: 'Lexend', sans-serif; font-size: 2.5rem; margin: 0; }

        .container {
            max-width: 900px;
            margin: -30px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .form-wrapper {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 10px;
        }

        /* This makes the Google Form fill the area nicely */
        iframe {
            width: 100%;
            height: 800px;
            border: none;
        }

        .back-nav {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-back {
            display: inline-block;
            background: var(--primary-green);
            color: var(--white);
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <h1>Add a New Walk</h1>
    </header>

    <div class="container">
        <div class="form-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScyCNyr0Dq-4bZSgv_DIGa16ZwwK0lekdvcFz1lJodVGOAn7A/viewform?embedded=true">
                Loading…
            </iframe>
        </div>

        <div class="back-nav">
            <a href="walks.html" class="btn-back">← Back to Walk List</a>
        </div>
    </div>

</body>
</html>
