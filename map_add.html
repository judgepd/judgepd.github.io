<!DOCTYPE html>
<html>
<head>
    <title>Add a Walk | Powick Ramblers</title>
    <style>
        #map { height: 400px; width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #2d5a27; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Add a New Walk</h2>
    
    <div id="map"></div> <form id="walkForm">
        <div class="form-group">
            <label>Meeting Location (Click map or type):</label>
            <input type="text" id="location" name="Meeting location" required placeholder="Click the map to set location...">
        </div>
        
        <div class="form-group">
            <label>Date of walk:</label>
            <input type="date" name="Date of walk" required>
        </div>

        <button type="submit">Submit Walk</button>
    </form>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWOK4CZrzbodcMJqpxUgTJCzwoV_aHwkA"></script>

    <script>
        let map;
        let marker;

        function initMap() {
            // Center the map on Worcester
            const worcester = { lat: 52.1912, lng: -2.2215 };
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: worcester,
            });

            // Listen for clicks on the map
            map.addListener("click", (mapsMouseEvent) => {
                const clickedPos = mapsMouseEvent.latLng;
                
                // Move or create the marker
                if (marker) {
                    marker.setPosition(clickedPos);
                } else {
                    marker = new google.maps.Marker({ position: clickedPos, map: map });
                }

                // Update the input field with coordinates or address
                document.getElementById('location').value = `${clickedPos.lat().toFixed(5)}, ${clickedPos.lng().toFixed(5)}`;
            });
        }

        // Handle Form Submission to SheetDB
        document.getElementById('walkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            fetch('https://sheetdb.io/api/v1/eag1jns4ulxm8', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [data] })
            })
            .then(res => {
                alert('Walk added successfully!');
                window.location.href = 'walks.html'; // Go back to the list
            })
            .catch(err => console.error(err));
        });

        window.onload = initMap;
    </script>
</body>
</html>
