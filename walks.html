<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powick Ramblers | Upcoming Walks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f4f7f1;
            --header-bg: #0f1f0d;
            --primary-green: #2d5a27;
            --text-main: #111111;
            --text-secondary: #444444;
            --white: #ffffff;
            --accent-light: #e8f5e9;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #0a1409 0%, #152b12 100%);
            color: var(--white);
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1100px;
            margin: -60px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Grid for Cards */
        #walks-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Card Styling */
        .walk-card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary-green);
            display: flex;
            flex-direction: column;
        }

        .walk-date {
            font-family: 'Lexend', sans-serif;
            font-size: 1.4rem;
            color: var(--primary-green);
            font-weight: 800;
            margin-bottom: 5px;
        }

        .walk-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .walk-detail {
            margin: 6px 0;
            font-size: 1.05rem;
        }

        .label {
            font-weight: 700;
            color: var(--text-main);
            width: 100px;
            display: inline-block;
        }

        .walk-info-box {
            background: var(--accent-light);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-top: auto; /* Pushes box to bottom of card */
            border-left: 3px solid var(--primary-green);
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            padding: 50px;
            color: var(--text-secondary);
        }

        .links-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            background: var(--primary-green);
            color: var(--white);
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            transition: 0.2s;
        }

        .btn-secondary { background: #e1e9df; color: var(--primary-green); }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            header p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Powick Ramblers</h1>
        <p>Exploring the Worcestershire countryside</p>
    </header>

    <div class="container">
        <div id="walks-container">
            <div class="loading-text">Loading the latest walks...</div>
        </div>

        <div class="links-container">
            <a href="https://judgepd.github.io/index.html" class="btn">Back</a>
            <a href="https://forms.gle/9hT7F9uQtR1PFgSa8" class="btn btn-secondary" target="_blank">Add a new walk</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://sheetdb.io/api/v1/eag1jns4ulxm8';

        async function fetchWalks() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Sort data by date descending (assuming DD/MM/YYYY)
                data.sort((a, b) => {
                    const dateA = new Date(a['Date of walk'].split('/').reverse().join('-'));
                    const dateB = new Date(b['Date of walk'].split('/').reverse().join('-'));
                    return dateB - dateA;
                });

                displayWalks(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('walks-container').innerHTML = '<div class="loading-text">Unable to load walks at this time. Please try again later.</div>';
            }
        }

        function displayWalks(walks) {
            const container = document.getElementById('walks-container');
            container.innerHTML = ''; // Clear loading text

            walks.forEach(walk => {
                const infoBox = walk['Useful information'] 
                    ? `<div class="walk-info-box"><strong>Note:</strong> ${walk['Useful information']}</div>` 
                    : '';

                const cardHTML = `
                    <div class="walk-card">
                        <div class="walk-date">${walk['Date of walk']}</div>
                        <div class="walk-meta">Leader: ${walk['Forename']} ${walk['Surname']}</div>
                        
                        <div class="walk-detail"><span class="label">Time:</span> ${walk['Meeting time']}</div>
                        <div class="walk-detail"><span class="label">Location:</span> ${walk['Meeting location']}</div>
                        <div class="walk-detail"><span class="label">Distance:</span> ${walk['Length of walk']}</div>
                        
                        ${infoBox}
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Run the function when page loads
        fetchWalks();
    </script>

</body>
</html>
