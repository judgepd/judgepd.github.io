<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powick Ramblers | Upcoming Walks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
        (function() {
            const accessKey = localStorage.getItem('ramblers_access');
            const now = new Date().getTime();
            if (!accessKey || now > parseInt(accessKey)) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        :root {
            --bg-body: #f4f7f1;
            --header-bg: #0f1f0d;
            --primary-green: #2d5a27;
            --text-main: #111111;
            --text-secondary: #444444;
            --white: #ffffff;
            --accent-light: #e8f5e9;
        }

        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--text-main); margin: 0; padding: 0; background-color: var(--bg-body); }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #0a1409 0%, #152b12 100%);
            color: var(--white);
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 30px;
        }

        h1 { font-family: 'Lexend', sans-serif; font-size: 3.5rem; font-weight: 800; margin: 0; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); }

        .container { max-width: 1200px; margin: -60px auto 40px; padding: 0 20px; position: relative; z-index: 10; }

        /* Controls Area */
        .list-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--white);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .refresh-btn {
            background: var(--accent-light);
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .refresh-btn:hover { background: #dceddb; }
        
        /* Spin animation for the refresh icon */
        .spinning { animation: rotate 1s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #walks-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }

        .walk-card {
            background: var(--white);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 8px solid var(--primary-green);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .walk-header-info { flex: 1.5; min-width: 300px; }
        .walk-stats-info { flex: 1; min-width: 250px; border-left: 1px solid #eee; padding-left: 20px; }
        .walk-date { font-family: 'Lexend', sans-serif; font-size: 1.6rem; color: var(--primary-green); font-weight: 800; margin-bottom: 5px; }
        .label { font-weight: 700; color: var(--text-main); width: 110px; display: inline-block; }
        .walk-info-box { background: var(--accent-light); padding: 15px; border-radius: 8px; width: 100%; border-left: 3px solid var(--primary-green); }

        .status-message { text-align: center; padding: 60px; background: white; border-radius: 16px; font-weight: 700; color: #666; }

        .links-container { display: flex; gap: 20px; justify-content: center; margin-top: 40px; }
        .btn { display: inline-block; background: var(--primary-green); color: var(--white); padding: 15px 40px; text-decoration: none; border-radius: 10px; font-weight: 800; }

        @media (max-width: 800px) {
            .walk-card { flex-direction: column; align-items: flex-start; }
            .walk-stats-info { border-left: none; padding-left: 0; border-top: 1px solid #eee; padding-top: 15px; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Powick Ramblers</h1>
        <p>Exploring the Worcestershire countryside</p>
    </header>

    <div class="container">
        <div class="list-controls">
            <span style="font-weight: 700; color: var(--text-secondary);">Upcoming Walks</span>
            <button class="refresh-btn" onclick="fetchWalks(true)">
                <span id="refresh-icon">↻</span> Refresh List
            </button>
        </div>

        <div id="walks-container">
            <div class="status-message">Loading walks...</div>
        </div>

        <div class="links-container">
            <a href="index.html" class="btn">Back</a>
            <a href="add-walk.html" class="btn" style="background:#e1e9df; color:#2d5a27;">Add a new walk</a>
        </div>
    </div>

    <script>
        const SHEET_ID = '1BEzHNrMLSIx871a4Kt70mHykAQ4YiOxCZpltKTIME6k';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let insideQuotes = false;
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                if (char === '"' && insideQuotes && csvText[i + 1] === '"') { currentField += '"'; i++; }
                else if (char === '"') { insideQuotes = !insideQuotes; }
                else if (char === ',' && !insideQuotes) { currentRow.push(currentField.trim()); currentField = ''; }
                else if ((char === '\r' || char === '\n') && !insideQuotes) {
                    if (currentField || currentRow.length > 0) { currentRow.push(currentField.trim()); rows.push(currentRow); currentField = ''; currentRow = []; }
                } else { currentField += char; }
            }
            if (currentField || currentRow.length > 0) { currentRow.push(currentField.trim()); rows.push(currentRow); }
            const headers = rows[0];
            return rows.slice(1).map(row => {
                let obj = {};
                headers.forEach((header, i) => obj[header] = row[i] || '');
                return obj;
            });
        }

        function formatDisplayDate(dateStr) {
            const [d, m, y] = dateStr.split('/');
            return new Date(y, m - 1, d).toLocaleDateString('en-GB', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        async function fetchWalks(isManual = false) {
            const container = document.getElementById('walks-container');
            const icon = document.getElementById('refresh-icon');
            
            if(isManual) icon.classList.add('spinning');

            try {
                // We add a timestamp to the URL to bypass browser caching and get fresh data
                const response = await fetch(`${CSV_URL}&cachebust=${new Date().getTime()}`);
                const csvText = await response.text();
                const data = parseCSV(csvText);

                const today = new Date().setHours(0,0,0,0);

                const upcoming = data.filter(w => {
                    if (!w['Date of walk']) return false;
                    const [d, m, y] = w['Date of walk'].split('/');
                    return new Date(y, m - 1, d) >= today;
                }).sort((a, b) => new Date(a['Date of walk'].split('/').reverse().join('-')) - new Date(b['Date of walk'].split('/').reverse().join('-')));

                if (upcoming.length === 0) {
                    container.innerHTML = '<div class="status-message">No upcoming walks scheduled.</div>';
                } else {
                    container.innerHTML = upcoming.map(w => `
                        <div class="walk-card">
                            <div class="walk-header-info">
                                <div class="walk-date">${formatDisplayDate(w['Date of walk'])}</div>
                                <div style="color:#666; font-weight:600;">Leader: ${w['Forename']} ${w['Surname']}</div>
                            </div>
                            <div class="walk-stats-info">
                                <div><span class="label">Time:</span> ${w['Meeting time']}</div>
                                <div><span class="label">Location:</span> ${w['Meeting location']}</div>
                                <div><span class="label">Distance:</span> ${w['Length of walk']}</div>
                            </div>
                            ${w['Useful information'] ? `<div class="walk-info-box"><strong>Note:</strong> ${w['Useful information']}</div>` : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                container.innerHTML = `<div class="status-message">Unable to load walks.</div>`;
            } finally {
                if(isManual) setTimeout(() => icon.classList.remove('spinning'), 500);
            }
        }

        fetchWalks();
    </script>
</body>
</html>
