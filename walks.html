<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powick Ramblers | Upcoming Walks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
	
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        :root {
            --bg-body: #f4f7f1;
            --header-bg: #0f1f0d;
            --primary-green: #2d5a27;
            --text-main: #111111;
            --text-secondary: #444444;
            --white: #ffffff;
            --accent-light: #e8f5e9;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #0a1409 0%, #152b12 100%);
            color: var(--white);
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1100px;
            margin: -60px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* The Grid for our Cards */
        .walks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Individual Walk Card */
        .walk-card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 6px solid var(--primary-green);
            transition: transform 0.2s ease;
        }

        .walk-card:hover {
            transform: translateY(-5px);
        }

        .walk-date {
            font-family: 'Lexend', sans-serif;
            font-size: 1.3rem;
            color: var(--primary-green);
            font-weight: 800;
            margin-bottom: 5px;
            display: block;
        }

        .walk-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .walk-detail {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .label {
            font-weight: 700;
            color: var(--text-main);
            display: inline-block;
            width: 90px;
        }

        .walk-info-box {
            background: var(--accent-light);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-top: 15px;
            font-style: italic;
        }

        .links-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            background: var(--primary-green);
            color: var(--white);
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            transition: 0.2s;
        }

        .btn-secondary { background: #e1e9df; color: var(--primary-green); }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .walks-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Powick Ramblers</h1>
        <p>Exploring the Worcestershire countryside</p>
    </header>

    <div class="container">
        <div id="walks-list" class="walks-grid" 
             data-sheetdb-url="https://sheetdb.io/api/v1/eag1jns4ulxm8"
             data-sheetdb-sort-by="Date of walk"
             data-sheetdb-sort-order="desc">
            
            <div class="walk-card">
                <span class="walk-date">{{Date of walk}}</span>
                <div class="walk-meta">Added by {{Forename}} {{Surname}}</div>
                
                <div class="walk-detail"><span class="label">Time:</span> {{Meeting time}}</div>
                <div class="walk-detail"><span class="label">Location:</span> {{Meeting location}}</div>
                <div class="walk-detail"><span class="label">Distance:</span> {{Length of walk}}</div>
                
                {{#if [Useful information]}}
                <div class="walk-info-box">
                    <strong>Note:</strong> {{Useful information}}
                </div>
                {{/if}}
            </div>

        </div>

        <div class="links-container">
            <a href="https://judgepd.github.io/index.html" class="btn">Back</a>
            <a href="https://forms.gle/9hT7F9uQtR1PFgSa8" class="btn btn-secondary" target="_blank">Add a new walk</a>
        </div>
    </div>

    <script src="https://sheetdb.io/handlebars.js"></script>

</body>
</html>
