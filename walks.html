<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powick Ramblers | Upcoming Walks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f4f7f1;
            --header-bg: #0f1f0d;
            --primary-green: #2d5a27;
            --text-main: #111111;
            --text-secondary: #444444;
            --white: #ffffff;
            --accent-light: #e8f5e9;
        }

        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--text-main); margin: 0; padding: 0; background-color: var(--bg-body); }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #0a1409 0%, #152b12 100%);
            color: var(--white);
            clip-path: ellipse(150% 100% at 50% 0%);
            margin-bottom: 30px;
        }

        h1 { font-family: 'Lexend', sans-serif; font-size: 3.5rem; font-weight: 800; margin: 0; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); }

        .container { 
            max-width: 1200px; /* Wider container for better readability on large screens */
            margin: -60px auto 40px; 
            padding: 0 20px; 
            position: relative; 
            z-index: 10; 
        }

        /* Stack layout: One walk per row, spanning full width */
        #walks-container { 
            display: flex;
            flex-direction: column;
            gap: 20px; 
            margin-bottom: 40px; 
        }

        .walk-card {
            background: var(--white);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 8px solid var(--primary-green); /* Border moved to the side for full-width look */
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        /* Grouping text so it stays organized in the wide row */
        .walk-header-info { flex: 1; min-width: 250px; }
        .walk-stats-info { flex: 1; min-width: 250px; border-left: 1px solid #eee; padding-left: 20px; }
        .walk-actions { width: 100%; border-top: 1px solid #eee; padding-top: 15px; margin-top: 10px; }

        .walk-date { font-family: 'Lexend', sans-serif; font-size: 1.6rem; color: var(--primary-green); font-weight: 800; margin-bottom: 5px; }
        .walk-meta { font-size: 1rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        .walk-detail { margin: 8px 0; font-size: 1.1rem; }
        .label { font-weight: 700; color: var(--text-main); width: 110px; display: inline-block; }

        .walk-info-box { background: var(--accent-light); padding: 15px; border-radius: 8px; font-size: 1rem; border-left: 3px solid var(--primary-green); margin-top: 10px; width: 100%; }

        .cal-links { display: flex; gap: 15px; }
        .btn-cal { padding: 10px 20px; font-size: 0.9rem; text-decoration: none; border-radius: 8px; font-weight: 700; transition: 0.2s; border: 1px solid transparent; }
        .google-cal { background-color: #4285F4; color: white; }
        .apple-cal { background-color: #111; color: white; }
        .btn-cal:hover { opacity: 0.9; transform: translateY(-1px); }

        .loading-text { text-align: center; font-size: 1.2rem; padding: 100px; color: var(--text-secondary); width: 100%; }

        .links-container { display: flex; gap: 20px; justify-content: center; margin-top: 40px; }
        .btn { display: inline-block; background: var(--primary-green); color: var(--white); padding: 15px 40px; text-decoration: none; border-radius: 10px; font-weight: 800; transition: 0.2s; }
        .btn-secondary { background: #e1e9df; color: var(--primary-green); }

        /* Responsive Fix: Stack sections on mobile */
        @media (max-width: 800px) {
            .walk-card { flex-direction: column; align-items: flex-start; }
            .walk-stats-info { border-left: none; padding-left: 0; border-top: 1px solid #eee; padding-top: 15px; width: 100%; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
